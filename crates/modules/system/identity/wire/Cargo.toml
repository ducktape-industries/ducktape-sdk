# The identity module's wire surface: accounts, keys, controls and their
# codecs, no module — the kernel host, the daemon, the auth page, the app and
# every sibling module link THIS and not the module behind it. No `native`
# feature, no kernel host, no disk.
[package]
name = "identity-wire"
edition.workspace = true
version.workspace = true

[dependencies]
sdk = { workspace = true }
keyscheme = { workspace = true }
# the `duck://` grammar and identity's half of it: `AccountAddress` ships in
# `duck-address` (so a view links it without this crate's signing graph) and
# this crate re-exports it.
duck-address = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
